<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Voice command to television action</title>
  <desc id="desc">Four steps connect an iPhone voice request to a television: capture, interpret, authenticate and execute.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="24" fill="#f8fafc"/>
  <text x="54" y="57" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="750">Voice to TV, in four steps</text>
  <text x="54" y="84" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Hold the Action Button, speak, and let the connector handle the rest.</text>

  <path d="M300 203H352" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M574 203H626" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M848 203H900" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(54 120)">
    <rect width="246" height="166" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="15" fill="#2563eb"/>
    <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750">1</text>
    <rect x="28" y="61" width="34" height="57" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="45" cy="109" r="2.5" fill="#2563eb"/>
    <text x="82" y="72" fill="#2563eb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1">CAPTURE</text>
    <text x="82" y="101" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">iPhone</text>
    <text x="82" y="125" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Action Button</text>
    <text x="28" y="148" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Speech becomes a request</text>
  </g>

  <g transform="translate(328 120)">
    <rect width="246" height="166" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="15" fill="#2563eb"/>
    <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750">2</text>
    <rect x="28" y="65" width="43" height="33" rx="4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M38 110h23M49.5 98v12" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="88" y="72" fill="#2563eb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1">INTERPRET</text>
    <text x="88" y="96" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">Windows</text>
    <text x="88" y="119" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">bridge</text>
    <text x="28" y="148" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Selects an allowlisted action</text>
  </g>

  <g transform="translate(602 120)">
    <rect width="246" height="166" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="15" fill="#2563eb"/>
    <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750">3</text>
    <rect x="28" y="64" width="44" height="44" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="50" cy="86" r="9" fill="#2563eb" opacity="0.18"/>
    <circle cx="50" cy="86" r="4" fill="#2563eb"/>
    <text x="89" y="72" fill="#2563eb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1">AUTHENTICATE</text>
    <text x="89" y="101" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">ATOMS3U</text>
    <text x="28" y="148" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Verifies and emits the command</text>
  </g>

  <g transform="translate(876 120)">
    <rect width="270" height="166" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="15" fill="#2563eb"/>
    <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750">4</text>
    <rect x="29" y="62" width="57" height="39" rx="4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M44 111h27M57.5 101v10" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="103" y="72" fill="#2563eb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1">EXECUTE</text>
    <text x="103" y="101" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">Television</text>
    <text x="29" y="148" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Apps, search and remote controls</text>
  </g>

  <line x1="54" y1="321" x2="1146" y2="321" stroke="#e2e8f0"/>
  <text x="600" y="354" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Private transport · authenticated commands · no vendor cloud</text>
</svg>
