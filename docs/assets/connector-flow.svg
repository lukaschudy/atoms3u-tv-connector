<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Voice-controlled TV connector flow</title>
  <desc id="desc">iPhone Action Button to agent host to ATOMS3U to television.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="180" fill="#ffffff"/>

  <text x="150" y="99" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="26" font-weight="700">iPhone Action Button</text>
  <text x="450" y="99" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="26" font-weight="700">Agent host</text>
  <text x="750" y="99" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="26" font-weight="700">ATOMS3U</text>
  <text x="1050" y="99" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="26" font-weight="700">TV</text>

  <path d="M275 90H345" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M555 90H645" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M850 90H945" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
