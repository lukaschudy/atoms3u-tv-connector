<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How the voice-controlled TV connector works</title>
  <desc id="desc">An iPhone sends a voice request to an agent host running on Windows or Linux, which sends an authenticated command to an ATOMS3U that controls the television.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- Connections -->
  <path d="M252 139H350" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M526 139H624" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 139H898" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- iPhone -->
  <g transform="translate(102 52)" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="0" width="66" height="112" rx="15"/>
    <line x1="64" y1="11" x2="86" y2="11"/>
    <circle cx="75" cy="98" r="3" fill="#111111" stroke="none"/>
  </g>
  <text x="177" y="202" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">iPhone</text>
  <text x="177" y="228" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Action Button</text>

  <!-- Agent host -->
  <g transform="translate(376 68)" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="22" y="2" width="106" height="40" rx="6"/>
    <rect x="22" y="58" width="106" height="40" rx="6"/>
    <circle cx="110" cy="22" r="4" fill="#111111" stroke="none"/>
    <circle cx="110" cy="78" r="4" fill="#111111" stroke="none"/>
    <line x1="37" y1="22" x2="79" y2="22"/>
    <line x1="37" y1="78" x2="79" y2="78"/>
  </g>
  <text x="451" y="202" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Agent host</text>
  <text x="451" y="228" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Windows or Linux</text>

  <!-- ATOMS3U -->
  <g transform="translate(650 61)" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="21" y="0" width="108" height="108" rx="18"/>
    <circle cx="75" cy="54" r="22"/>
    <circle cx="75" cy="54" r="6" fill="#111111" stroke="none"/>
  </g>
  <text x="725" y="202" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">ATOMS3U</text>
  <text x="725" y="228" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">connector</text>

  <!-- Television -->
  <g transform="translate(924 69)" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="150" height="84" rx="7"/>
    <line x1="75" y1="84" x2="75" y2="104"/>
    <line x1="43" y1="104" x2="107" y2="104"/>
  </g>
  <text x="999" y="202" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">TV</text>
  <text x="999" y="228" text-anchor="middle" fill="#111111" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">IR or USB</text>
</svg>
