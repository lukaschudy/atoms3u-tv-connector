[platformio]
default_envs =
    atoms3u-tv-connector
    atoms3u-tv-connector-u002
    atoms3u-hid-diagnostic
    atoms3u-network-diagnostic
    atoms3u-ir-learning

[env:native-contract-tests]
platform = native
test_framework = unity
test_build_src = no

[env:atoms3u-tv-connector]
platform = espressif32 @ 7.0.1
board = m5stack-atoms3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_src_filter =
    +<main.cpp>
    -<diagnostic_*.cpp>
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DESP32S3
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    arduino-irremote/IRremote @ 4.7.1

[env:atoms3u-tv-connector-u002]
extends = env:atoms3u-tv-connector
build_flags =
    ${env:atoms3u-tv-connector.build_flags}
    -DROOM_AGENT_IR_OUTPUT=ROOM_AGENT_IR_OUTPUT_UNIT_IR_U002

[env:atoms3u-hid-diagnostic]
