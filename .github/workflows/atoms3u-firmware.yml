name: ATOMS3U firmware

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: atoms3u-tv-connector
            profile: generic-usb-hid-v1
            artifact: generic-built-in
          - environment: atoms3u-tv-connector
            profile: sony-bravia-ir-v1
            artifact: sony-built-in
          - environment: atoms3u-tv-connector
            profile: lg-tv-ir-v1
            artifact: lg-built-in
          - environment: atoms3u-tv-connector
            profile: lg-webos-hybrid-v1
            artifact: lg-hybrid-built-in
          - environment: atoms3u-tv-connector-u002
            profile: generic-usb-hid-v1
            artifact: generic-u002
          - environment: atoms3u-tv-connector-u002
            profile: sony-bravia-ir-v1
            artifact: sony-u002
          - environment: atoms3u-tv-connector-u002
            profile: lg-tv-ir-v1
            artifact: lg-u002
          - environment: atoms3u-tv-connector-u002
            profile: lg-webos-hybrid-v1
            artifact: lg-hybrid-u002
          - environment: atoms3u-hid-diagnostic
            profile: generic-usb-hid-v1
            artifact: hid-diagnostic
          - environment: atoms3u-network-diagnostic
            profile: generic-usb-hid-v1
            artifact: network-diagnostic
          - environment: atoms3u-ir-learning
            profile: lg-tv-ir-v1
            artifact: ir-learning
    defaults:
      run:
        working-directory: room_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check -r ../requirements-tv-connector.txt
      - name: Prepare compile-only settings
        env:
          CONNECTOR_PROFILE: ${{ matrix.profile }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          profiles = {
              "generic-usb-hid-v1",
              "sony-bravia-ir-v1",
              "lg-tv-ir-v1",
              "lg-webos-hybrid-v1",
          }
          profile = os.environ["CONNECTOR_PROFILE"]
          if profile not in profiles:
              raise SystemExit("unsupported CI profile")
          include = Path("firmware/atoms3u_tv_connector/include")
          content = (include / "secrets.example.h").read_text(encoding="utf-8")
          content = content.replace("generic-usb-hid-v1", profile)
          (include / "secrets.h").write_text(content, encoding="utf-8")
          PY
      - name: Build ${{ matrix.environment }}
        env:
          BUILD_ENVIRONMENT: ${{ matrix.environment }}
        run: >-
          pio run
          -d firmware/atoms3u_tv_connector
          -e "$BUILD_ENVIRONMENT"

  native-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: room_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check -r ../requirements-tv-connector.txt
      - name: Run native protocol contract tests
        run: pio test -d firmware/atoms3u_tv_connector -e native-contract-tests
