name: Bug report
description: Report a reproducible software, setup, or firmware problem.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove credentials, Wi-Fi names, local addresses, pairing files, and configured firmware before posting."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command, selected profile, and safe/redacted output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and exact TV model (if relevant)
